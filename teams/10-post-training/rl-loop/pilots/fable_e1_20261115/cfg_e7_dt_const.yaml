# E7 (16 Nov 2026): E4b with ONE change, the DT sharpness alpha held constant at 1000 (alpha_end 1000 instead of 10000).
# Preregistration: work/fable-research-2026-11-15/PREREG_E7_dt_const_alpha.md. Everything else is cfg_e4b_dt.yaml
# byte for byte: seed, model, objective, cohort, held-out set, mask lr 3e-3, batch 16 x 8, evaluations at 0/10/20,
# lambda 1e-5 with its decay over alpha_steps 100 (alpha_steps no longer moves alpha; it still sets the lambda decay).
seed: 1234
device: cuda
verbose: true
model: {kind: hf, path: "@WEIGHTS@", dtype: bfloat16, stop_at_eos: true, dense: true}
task: {kind: stdio, tasks: "@DATA@/tasks.jsonl", train_ids: "@DATA@/train_ids.txt", heldout_ids: "@DATA@/heldout_ids.txt"}
train: {algo: objective_v1, steps: @STEPS@, prompts_per_step: 16, k: 8, max_new: 1024, temperature: 1.0, lr: 3.0e-3,
        ppo_epochs: 1, kl_coef: 0.0, grad_clip: 1.0, eval_every: 10, eval_k: 8, cohort_eval_k: 8,
        sampler: vllm, vllm: {gpu_memory_utilization: 0.2, max_model_len: 2048}, micro_rows: 1,
        reward_workers: 32, reward_pool: 32,
        dt: {targets: gate, eta: 0.00048828125, prior_strength: 3.0, alpha_start: 1000.0, alpha_end: 1000.0,
             lambda: 1.0e-5, calib_prompts: 56, alpha_steps: 100},
        state_dir: "@RUN@/state", state_every: 20, deadline_unix: @DEADLINE@}
