# Gate 2 decision, 14 Nov 2026.
# Muon, v0 attention, 16 routed experts plus 1 shared, top-2.
# optim.lr stays 1e-3 and stays provisional.
# 21 Nov 2026: optim.muon_lr set to 0.003 (TSAI, Muon with the KE2/KAS head).
# 22 Nov 2026: optim.muon_lr corrected to 0.006 (TSAI, both optimizers tuned at batch 32x256).
# 23 Nov 2026: optim.router_on_muon set to true (TSAI, #712 router comparison).
# Model sizes and embedding.ke2_output_dim stay empty.
# The reasons are in decisions.md.
settings:
  - key: run.seed
    value: 1234
    source: "G5 week-1 gate, 24 Oct 2026. Two runs with this seed must match."
  - key: run.grad_clip
    value: 1.0
    source: "The harness sets the clip. DeepSpeed clips at 1.0 by default and plain DDP does not."
  - key: optim.name
    value: muon
    source: "Gate 2, 14 Nov 2026. The optimizer is Muon. Gate 2 named no separate Muon matrix rate; TSAI set it on 21 Nov 2026 (optim.muon_lr below)."
  - key: optim.lr
    value: 0.001
    open: true
    source: "Gate 2, 14 Nov 2026. The learning rate 1e-3 stays provisional. The T1 table still stands: lowest whole-file val/bpb on all three seeds, smallest spread, mean 1.9686, SD 0.0070, for 245-step T1 runs. Three-group, code, and Indic values were not measured."
  - key: optim.muon_lr
    value: 0.006
    source: "TSAI, 05 Architecture, 22 Nov 2026 correction: at batch 32x256 with both optimizers tuned, Muon's best lr is 0.006 (1.5437 bpb) and AdamW's 1.5e-4 (1.5595 bpb), a 0.016 bpb gap on one seed. The best Muon lr moved with about the square root of the batch ratio (8 to 32), so 0.006 is the better current estimate, not final; expect one more retune at the training batch size. Earlier, 21 Nov 2026: Muon on the 2D block matrices at lr 0.003; AdamW on the embeddings, the KE2/KAS head and the other scalars. 1.5889 bpb against 1.6170 for AdamW at the same setup. One seed at 2,048 tokens per step, so 0.003 is the starting point to validate at the training batch size."
  - key: optim.router_on_muon
    value: true
    source: "TSAI, 05 Architecture, 23 Nov 2026. #712 (one seed per arm, T2, seed 1234, frozen p1536): router on Muon val/bpb 1.4999 vs router on AdamW 1.5018, a 0.0019 gap, far below the T2 seed spread (0.0254) -- no measurable quality difference. Resource check (same run pair): optimizer-memory and gradient-norm/clipping differences are noise-level; step-time difference was confounded by two mid-run restarts on the Muon arm and not treated as a signal. Reverses the 21 Nov default (router on AdamW, #706), which was precautionary, not evidence-based. Matches current field practice: Kolibri (Aleph Alpha) and DeepSeek-V4.1-Flash both treat the MoE router as an ordinary 2D matrix on Muon, with no AdamW carve-out. Expert-load-balance telemetry (#607) was off for #712; a confirmatory rerun with it on is in progress but not blocking this default."
  - key: tokenizer.name
    value: BrahmicTokenizer-131K
    source: "G3 week-1 note. BrahmicTokenizer-131K is tokenizer v0. The file arrives 28 Oct."
  - key: tokenizer.vocab_size
    value: 131072
    source: "G3 teams/03-tokenizer/v0/special_slots.md. Vocab 131,072, special ids frozen. Rajiv Seelam, CAP, 1 Nov 2026."
  - key: embedding.type
    value: kronecker
    source: "https://github.com/theschoolofai/kronecker-embeddings and arXiv 2605.29459."
  - key: embedding.pos_dim
    value: 32
    source: "kronecker-embeddings library default pos_dim. Paper 2605.29459 section 6.9 also reports pos_dim 16."
