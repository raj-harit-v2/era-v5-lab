<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Survivor loss</title>
<desc id="d">A dedup group is lost when F2 drops every survivor, partly_hit when it drops some but not all (only groups with several held-out survivors), untouched when it drops none, and without_survivor when dedup kept no copy.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em}
.h1{font-size:24px;font-weight:600}
.sub{font-size:14.5px}
.b{font-weight:600}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.1)}}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.bg{fill:#ffffff;stroke:#d1d9e0}.panel{fill:#f6f8fa;stroke:#d1d9e0}.edge{stroke:#d1d9e0}.edgef{fill:#d1d9e0}.bgf{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.faint{fill:#818b98}.inks{stroke:#1f2328}.mutes{stroke:#59636e}.teal{fill:#0f7b6c}.teal-s{stroke:#0f7b6c}.teal-t{fill:#e1f5f0}.teal-c{fill:#e1f5f0;stroke:#0f7b6c}.violet{fill:#8250df}.violet-s{stroke:#8250df}.violet-t{fill:#f1ebfd}.violet-c{fill:#f1ebfd;stroke:#8250df}.amber{fill:#9a6700}.amber-s{stroke:#9a6700}.amber-t{fill:#fdf3dc}.amber-c{fill:#fdf3dc;stroke:#9a6700}.red{fill:#cf222e}.red-s{stroke:#cf222e}.red-t{fill:#ffebe9}.red-c{fill:#ffebe9;stroke:#cf222e}.green{fill:#1a7f37}.green-s{stroke:#1a7f37}.green-t{fill:#dcf7e3}.green-c{fill:#dcf7e3;stroke:#1a7f37}.blue{fill:#0969da}.blue-s{stroke:#0969da}.blue-t{fill:#ddf0ff}.blue-c{fill:#ddf0ff;stroke:#0969da}.gray{fill:#6e7781}.gray-s{stroke:#6e7781}.gray-t{fill:#eef1f4}.gray-c{fill:#eef1f4;stroke:#6e7781}@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.edge{stroke:#30363d}.edgef{fill:#30363d}.bgf{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.faint{fill:#6e7681}.inks{stroke:#e6edf3}.mutes{stroke:#9198a1}.teal{fill:#3cc2a8}.teal-s{stroke:#3cc2a8}.teal-t{fill:#0d2a26}.teal-c{fill:#0d2a26;stroke:#3cc2a8}.violet{fill:#b392f0}.violet-s{stroke:#b392f0}.violet-t{fill:#221a38}.violet-c{fill:#221a38;stroke:#b392f0}.amber{fill:#d9a53a}.amber-s{stroke:#d9a53a}.amber-t{fill:#2b2111}.amber-c{fill:#2b2111;stroke:#d9a53a}.red{fill:#ff7b72}.red-s{stroke:#ff7b72}.red-t{fill:#3a1619}.red-c{fill:#3a1619;stroke:#ff7b72}.green{fill:#3fb950}.green-s{stroke:#3fb950}.green-t{fill:#10281a}.green-c{fill:#10281a;stroke:#3fb950}.blue{fill:#58a6ff}.blue-s{stroke:#58a6ff}.blue-t{fill:#0c2440}.blue-c{fill:#0c2440;stroke:#58a6ff}.gray{fill:#8b949e}.gray-s{stroke:#8b949e}.gray-t{fill:#1c2128}.gray-c{fill:#1c2128;stroke:#8b949e}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<rect class="bg" x=".5" y=".5" width="1199" height="399" rx="14"/>
<g class="rise"><text x="40" y="48" class="eyebrow mute">SURVIVOR LOSS</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">When F2 drops a survivor, its group loses a copy</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">Dedup keeps one copy per group (every held-out copy, rule 0); F2 runs after it and removed copies never come back.</text></g>
<g class="rise d2"><rect x="40" y="140" width="264" height="190" rx="12" class="panel" stroke-width="1.2"/><text x="60" y="172" class="mono b red" font-size="15">lost</text><rect x="60" y="196" width="44" height="54" rx="6" class="red-c" stroke-width="1.6"/><text x="82" y="220" class="red b" font-size="14" text-anchor="middle">S</text><text x="82" y="238" class="red" font-size="10" text-anchor="middle">F2 drop</text><rect x="118" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M130 212l20 22M150 212l-20 22" class="mutes" stroke-width="1.4"/><rect x="176" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M188 212l20 22M208 212l-20 22" class="mutes" stroke-width="1.4"/><text x="60" y="280" class="mute" font-size="12.5">every survivor dropped by F2:</text><text x="60" y="298" class="mute" font-size="12.5">no copy reaches the final data</text></g>
<g class="rise d3"><rect x="324" y="140" width="264" height="190" rx="12" class="panel" stroke-width="1.2"/><text x="344" y="172" class="mono b amber" font-size="15">partly_hit</text><rect x="344" y="196" width="44" height="54" rx="6" class="green-c" stroke-width="1.6"/><text x="366" y="220" class="green b" font-size="14" text-anchor="middle">S</text><text x="366" y="238" class="green" font-size="10" text-anchor="middle">F2 keep</text><rect x="402" y="196" width="44" height="54" rx="6" class="red-c" stroke-width="1.6"/><text x="424" y="220" class="red b" font-size="14" text-anchor="middle">S</text><text x="424" y="238" class="red" font-size="10" text-anchor="middle">F2 drop</text><rect x="460" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M472 212l20 22M492 212l-20 22" class="mutes" stroke-width="1.4"/><text x="344" y="280" class="mute" font-size="12.5">some survivors dropped, not all:</text><text x="344" y="298" class="mute" font-size="12.5">only groups with several held-out survivors</text></g>
<g class="rise d4"><rect x="608" y="140" width="264" height="190" rx="12" class="panel" stroke-width="1.2"/><text x="628" y="172" class="mono b green" font-size="15">untouched</text><rect x="628" y="196" width="44" height="54" rx="6" class="green-c" stroke-width="1.6"/><text x="650" y="220" class="green b" font-size="14" text-anchor="middle">S</text><text x="650" y="238" class="green" font-size="10" text-anchor="middle">F2 keep</text><rect x="686" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M698 212l20 22M718 212l-20 22" class="mutes" stroke-width="1.4"/><rect x="744" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M756 212l20 22M776 212l-20 22" class="mutes" stroke-width="1.4"/><text x="628" y="280" class="mute" font-size="12.5">F2 kept every survivor:</text><text x="628" y="298" class="mute" font-size="12.5">nothing lost</text></g>
<g class="rise d5"><rect x="892" y="140" width="264" height="190" rx="12" class="panel" stroke-width="1.2"/><text x="912" y="172" class="mono b gray" font-size="15">without_survivor</text><rect x="912" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M924 212l20 22M944 212l-20 22" class="mutes" stroke-width="1.4"/><rect x="970" y="196" width="44" height="54" rx="6" class="panel" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M982 212l20 22M1002 212l-20 22" class="mutes" stroke-width="1.4"/><text x="912" y="280" class="mute" font-size="12.5">dedup kept no copy (no usable</text><text x="912" y="298" class="mute" font-size="12.5">licence, rule 1); F2 cannot change it</text></g>
<rect x="40" y="359" width="14" height="14" rx="3" class="green-c"/><text x="62" y="370" class="mute" font-size="12.5">survivor F2 kept</text><rect x="200" y="359" width="14" height="14" rx="3" class="red-c"/><text x="222" y="370" class="mute" font-size="12.5">survivor F2 dropped</text><rect x="380" y="359" width="14" height="14" rx="3" class="panel" stroke-dasharray="3 2"/><text x="402" y="370" class="mute" font-size="12.5">removed by dedup</text><text x="1160" y="370" class="mono faint" font-size="12" text-anchor="end">matched on split + part + doc_id</text>
</svg>
