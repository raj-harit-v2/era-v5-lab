violet-c{fill:#221a38;stroke:#b392f0}.amber{fill:#d9a53a}.amber-s{stroke:#d9a53a}.amber-t{fill:#2b2111}.amber-c{fill:#2b2111;stroke:#d9a53a}.red{fill:#ff7b72}.red-s{stroke:#ff7b72}.red-t{fill:#3a1619}.red-c{fill:#3a1619;stroke:#ff7b72}.green{fill:#3fb950}.green-s{stroke:#3fb950}.green-t{fill:#10281a}.green-c{fill:#10281a;stroke:#3fb950}.blue{fill:#58a6ff}.blue-s{stroke:#58a6ff}.blue-t{fill:#0c2440}.blue-c{fill:#0c2440;stroke:#58a6ff}.gray{fill:#8b949e}.gray-s{stroke:#8b949e}.gray-t{fill:#1c2128}.gray-c{fill:#1c2128;stroke:#8b949e}}.r0{animation:r0 10.0s ease-in-out 0.0s infinite both}@keyframes r0{0%{transform:translate(0,0);opacity:0}4%{opacity:1}70%{transform:translate(1118px,0);opacity:1}78%,100%{transform:translate(1118px,0);opacity:0}}.r1{animation:r1 10.0s ease-in-out 1.6s infinite both}@keyframes r1{0%{transform:translate(0,0);opacity:0}4%{opacity:1}6.6%{transform:translate(47.0px,0)}14.6%{transform:translate(47.0px,57px);opacity:1}20.6%,100%{transform:translate(47.0px,57px);opacity:0}}.r2{animation:r2 10.0s ease-in-out 3.2s infinite both}@keyframes r2{0%{transform:translate(0,0);opacity:0}4%{opacity:1}27.9%{transform:translate(431.0px,0)}35.9%{transform:translate(431.0px,57px);opacity:1}41.9%,100%{transform:translate(431.0px,57px);opacity:0}}.r3{animation:r3 10.0s ease-in-out 4.8s infinite both}@keyframes r3{0%{transform:translate(0,0);opacity:0}4%{opacity:1}35.0%{transform:translate(559.0px,0)}43.0%{transform:translate(559.0px,57px);opacity:1}49.0%,100%{transform:translate(559.0px,57px);opacity:0}}.r4{animation:r4 10.0s ease-in-out 6.4s infinite both}@keyframes r4{0%{transform:translate(0,0);opacity:0}4%{opacity:1}54.1%{transform:translate(903.0px,0)}62.1%{transform:translate(903.0px,57px);opacity:1}68.1%,100%{transform:translate(903.0px,57px);opacity:0}}.r5{animation:r5 10.0s ease-in-out 8.0s infinite both}@keyframes r5{0%{transform:translate(0,0);opacity:0}4%{opacity:1}70%{transform:translate(1118px,0);opacity:1}78%,100%{transform:translate(1118px,0);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<rect class="bg" x=".5" y=".5" width="1199" height="499" rx="14"/>
<g class="rise"><text x="40" y="48" class="eyebrow mute">THE FLOW</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">How a document travels</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">Every document leaves at exactly one stage, or ends in a shard. The diamonds are the inventory check points.</text></g>
<g class="fade d2"><rect x="24" y="144" width="372" height="3" rx="1.5" class="teal"/><text x="24" y="136" class="teal eyebrow" font-size="10.5">TSAI JOBS · ADOPT OR RUN</text></g>
<g class="fade d2"><rect x="408" y="144" width="500" height="3" rx="1.5" class="violet"/><text x="408" y="136" class="violet eyebrow" font-size="10.5">RUN_PIPELINE.PY · ALWAYS RUN</text></g>
<g class="fade d2"><rect x="920" y="144" width="244" height="3" rx="1.5" class="amber"/><text x="920" y="136" class="amber eyebrow" font-size="10.5">CONFIGURED · REQUIRED FOR THE JOB</text></g>
<g class="rise d2"><rect x="24" y="158" width="116" height="104" rx="10" class="teal-c" stroke-width="1.2"/><text x="36" y="180" class="mono teal" font-size="11.5">01</text><text x="36" y="204" class="ink b" font-size="15.5">clean</text><text x="36" y="228" class="mute" font-size="12">keep · fix · drop</text><text x="36" y="245" class="mute" font-size="12">spec v1.1 cleaner</text></g>
<g class="rise d3"><rect x="152" y="158" width="116" height="104" rx="10" class="teal-c" stroke-width="1.2"/><text x="164" y="180" class="mono teal" font-size="11.5">02</text><text x="164" y="204" class="ink b" font-size="15.5">overlap</text><text x="164" y="228" class="mute" font-size="12">find near-copies</text><text x="164" y="245" class="mute" font-size="12">H1 + H2</text></g>
<g class="rise d4"><rect x="280" y="158" width="116" height="104" rx="10" class="teal-c" stroke-width="1.2"/><text x="292" y="180" class="mono teal" font-size="11.5">03</text><text x="292" y="204" class="ink b" font-size="15.5">dedup</text><text x="292" y="228" class="mute" font-size="12">pick survivors</text><text x="292" y="245" class="mute" font-size="12">rules 0–4</text></g>
<g class="rise d5"><rect x="408" y="158" width="116" height="104" rx="10" class="violet-c" stroke-width="1.2"/><text x="420" y="180" class="mono violet" font-size="11.5">04</text><text x="420" y="204" class="ink b" font-size="15.5">apply</text><text x="420" y="228" class="mute" font-size="12">remove the</text><text x="420" y="245" class="mute" font-size="12">listed copies</text></g>
<g class="rise d6"><rect x="536" y="158" width="116" height="104" rx="10" class="violet-c" stroke-width="1.2"/><text x="548" y="180" class="mono violet" font-size="11.5">05</text><text x="548" y="204" class="ink b" font-size="15.5">f2</text><text x="548" y="228" class="mute" font-size="12">drop benchmark</text><text x="548" y="245" class="mute" font-size="12">copies · G9 v2</text></g>
<g class="rise d7"><rect x="664" y="158" width="116" height="104" rx="10" class="violet-c" stroke-width="1.2"/><text x="676" y="180" class="mono violet" font-size="11.5">06</text><text x="676" y="204" class="ink b" font-size="15.5">survivor loss</text><text x="676" y="228" class="mute" font-size="12">count groups</text><text x="676" y="245" class="mute" font-size="12">F2 emptied</text></g>
<g class="rise d8"><rect x="792" y="158" width="116" height="104" rx="10" class="violet-c" stroke-width="1.2"/><text x="804" y="180" class="mono violet" font-size="11.5">07</text><text x="804" y="204" class="ink b" font-size="15.5">ledger</text><text x="804" y="228" class="mute" font-size="12">a row per doc,</text><text x="804" y="245" class="mute" font-size="12">every decision</text></g>
<g class="rise d9"><rect x="920" y="158" width="116" height="104" rx="10" class="amber-c" stroke-width="1.2"/><text x="932" y="180" class="mono amber" font-size="11.5">08</text><text x="932" y="204" class="ink b" font-size="15.5">shards</text><text x="932" y="228" class="mute" font-size="12">tokenize, p1536</text><text x="932" y="245" class="mute" font-size="12">.bin + manifest</text></g>
<g class="rise d10"><rect x="1048" y="158" width="116" height="104" rx="10" class="amber-c" stroke-width="1.2"/><text x="1060" y="180" class="mono amber" font-size="11.5">09</text><text x="1060" y="204" class="ink b" font-size="15.5">reconcile</text><text x="1060" y="228" class="mute" font-size="12">every kept doc</text><text x="1060" y="245" class="mute" font-size="12">placed once</text></g>
