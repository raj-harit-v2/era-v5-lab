<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">How a document travels</title>
<desc id="d">Nine stages. Clean, overlap and dedup are TSAI jobs the runner adopts or runs; apply, f2, survivor loss and the ledger always run; shards and reconcile run when configured, and the production job configures both. A document leaves at the cleaner (dropped), at apply (removed by dedup), at f2 (benchmark copy), or is left out by the shard writer with a reason; held-out parts are not sharded; every other kept document ends in a shard. The expected inventory is checked before the shard stage and after reconcile.</desc>
