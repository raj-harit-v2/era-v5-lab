<text x="40" y="458" class="mute" font-size="12.5">Stays in a drop: the cleaned folder (other runs adopt it), held-out parts (not sharded: final/heldout is their only filtered copy), unselected packs.</text>
<text x="40" y="478" class="faint" font-size="12">Measured on the rehearsal: drop deleted exactly the 2 train parts in deduped/ and final/. A dropped run cannot be resumed: a new run needs a new run_id.</text>
