<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Keep or drop intermediate Parquet</title>
<desc id="d">With keep (the default) every stage's Parquet stays. With drop, after reconcile passed, the run deletes from deduped/ and final/ the Parquet of each part whose kept documents are all in shards or left out with a reason. The cleaned folder, held-out parts and unselected packs stay. On the rehearsal, drop deleted 4 files (185.8 MB) and left everything else byte-identical.</desc>
