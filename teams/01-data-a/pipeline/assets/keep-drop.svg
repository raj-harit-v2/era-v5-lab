<g class="rise"><text x="40" y="48" class="eyebrow mute">INTERMEDIATE PARQUET · TASK 4.8</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">"intermediates": "keep" or "drop"</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">A drop runs only after reconcile passed, and deletes a part only when all its kept documents are in shards or left out with a reason.</text></g>
