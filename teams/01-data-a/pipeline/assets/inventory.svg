<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">The inventory gate</title>
<desc id="d">The expected inventory is written before the run from the approved input manifest. Check point 1, on entry to the shard stage, makes 6 checks: the clean job read this input manifest, the ledger is mode B, it holds exactly the listed parts, every listed pack and no other with kept documents, each part's raw sha256 and raw rows. Check point 2, after reconcile, repeats them and checks the shard summary: exactly the listed parts, each in a listed status and of its listed pack. Any difference stops the run and is written to inventory_check.json.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em}
.h1{font-size:24px;font-weight:600}
.sub{font-size:14.5px}
.b{font-weight:600}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.1)}}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.bg{fill:#ffffff;stroke:#d1d9e0}.panel{fill:#f6f8fa;stroke:#d1d9e0}.edge{stroke:#d1d9e0}.edgef{fill:#d1d9e0}.bgf{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.faint{fill:#818b98}.inks{stroke:#1f2328}.mutes{stroke:#59636e}.teal{fill:#0f7b6c}.teal-s{stroke:#0f7b6c}.teal-t{fill:#e1f5f0}.teal-c{fill:#e1f5f0;stroke:#0f7b6c}.violet{fill:#8250df}.violet-s{stroke:#8250df}.violet-t{fill:#f1ebfd}.violet-c{fill:#f1ebfd;stroke:#8250df}.amber{fill:#9a6700}.amber-s{stroke:#9a6700}.amber-t{fill:#fdf3dc}.amber-c{fill:#fdf3dc;stroke:#9a6700}.red{fill:#cf222e}.red-s{stroke:#cf222e}.red-t{fill:#ffebe9}.red-c{fill:#ffebe9;stroke:#cf222e}.green{fill:#1a7f37}.green-s{stroke:#1a7f37}.green-t{fill:#dcf7e3}.green-c{fill:#dcf7e3;stroke:#1a7f37}.blue{fill:#0969da}.blue-s{stroke:#0969da}.blue-t{fill:#ddf0ff}.blue-c{fill:#ddf0ff;stroke:#0969da}.gray{fill:#6e7781}.gray-s{stroke:#6e7781}.gray-t{fill:#eef1f4}.gray-c{fill:#eef1f4;stroke:#6e7781}@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.edge{stroke:#30363d}.edgef{fill:#30363d}.bgf{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.faint{fill:#6e7681}.inks{stroke:#e6edf3}.mutes{stroke:#9198a1}.teal{fill:#3cc2a8}.teal-s{stroke:#3cc2a8}.teal-t{fill:#0d2a26}.teal-c{fill:#0d2a26;stroke:#3cc2a8}.violet{fill:#b392f0}.violet-s{stroke:#b392f0}.violet-t{fill:#221a38}.violet-c{fill:#221a38;stroke:#b392f0}.amber{fill:#d9a53a}.amber-s{stroke:#d9a53a}.amber-t{fill:#2b2111}.amber-c{fill:#2b2111;stroke:#d9a53a}.red{fill:#ff7b72}.red-s{stroke:#ff7b72}.red-t{fill:#3a1619}.red-c{fill:#3a1619;stroke:#ff7b72}.green{fill:#3fb950}.green-s{stroke:#3fb950}.green-t{fill:#10281a}.green-c{fill:#10281a;stroke:#3fb950}.blue{fill:#58a6ff}.blue-s{stroke:#58a6ff}.blue-t{fill:#0c2440}.blue-c{fill:#0c2440;stroke:#58a6ff}.gray{fill:#8b949e}.gray-s{stroke:#8b949e}.gray-t{fill:#1c2128}.gray-c{fill:#1c2128;stroke:#8b949e}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<rect class="bg" x=".5" y=".5" width="1199" height="559" rx="14"/>
<g class="rise"><text x="40" y="48" class="eyebrow mute">THE INVENTORY GATE · JOB REQUEST GATE 12</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">A part that never reached the run still stops it</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">The ledger, the shard summary and the reconciliation all describe what the run made; only a list written before the run can miss a part.</text></g>
<g class="rise d2"><path d="M40 138h200l24 24v212h-224z" class="blue-c" stroke-width="1.4"/><path d="M240 138v24h24" fill="none" class="blue-s" stroke-width="1.4"/><text x="56" y="168" class="mono blue b" font-size="12">expected_inventory.json</text><text x="56" y="198" class="mono ink" font-size="11.5">input_manifest_sha256</text><text x="56" y="219" class="mono ink" font-size="11.5">packs: [code-go, …]</text><text x="56" y="240" class="mono ink" font-size="11.5">parts: [</text><text x="70" y="261" class="mono ink" font-size="11.5">part, raw_sha256,</text><text x="70" y="282" class="mono ink" font-size="11.5">raw_rows, expected</text><text x="56" y="303" class="mono ink" font-size="11.5">]</text><text x="56" y="344" class="mute" font-size="12">written before the run,</text><text x="56" y="361" class="mute" font-size="12">from the approved manifest</text></g>
<path d="M300 222H880" class="edge" stroke-width="2"/>
<path d="M270 228C 290 228, 300 152, 470 210" fill="none" class="blue-s" stroke-width="1.3" stroke-dasharray="4 4"/>
<path d="M270 228C 420 168, 760 134, 880 210" fill="none" class="blue-s" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="360" cy="222" r="8" class="bgf violet-s" stroke-width="2.2"/><text x="360" y="252" class="ink" font-size="13.5" text-anchor="middle">ledger</text>
<circle cx="580" cy="222" r="8" class="bgf amber-s" stroke-width="2.2"/><text x="580" y="252" class="ink" font-size="13.5" text-anchor="middle">shards</text>
<circle cx="760" cy="222" r="8" class="bgf amber-s" stroke-width="2.2"/><text x="760" y="252" class="ink" font-size="13.5" text-anchor="middle">reconcile</text>
<rect x="461" y="213" width="18" height="18" transform="rotate(45 470 222)" class="blue"/><text x="470" y="252" class="blue b" font-size="12.5" text-anchor="middle">check point 1</text>
<rect x="871" y="213" width="18" height="18" transform="rotate(45 880 222)" class="blue"/><text x="880" y="252" class="blue b" font-size="12.5" text-anchor="middle">check point 2</text>
<g class="rise d4"><rect x="310" y="282" width="330" height="190" rx="10" class="panel" stroke-width="1.2"/><text x="326" y="306" class="blue b" font-size="13">on entry to the shard stage · 6 checks</text><text x="326" y="324" class="faint" font-size="11.5">also when a run resumes there</text><circle cx="332" cy="344" r="3" class="blue"/><text x="342" y="348" class="ink" font-size="12.5">the clean job read this input manifest</text><circle cx="332" cy="365" r="3" class="blue"/><text x="342" y="369" class="ink" font-size="12.5">the ledger is mode B (raw parts)</text><circle cx="332" cy="386" r="3" class="blue"/><text x="342" y="390" class="ink" font-size="12.5">exactly the listed parts</text><circle cx="332" cy="407" r="3" class="blue"/><text x="342" y="411" class="ink" font-size="12.5">every listed pack; no other has kept docs</text><circle cx="332" cy="428" r="3" class="blue"/><text x="342" y="432" class="ink" font-size="12.5">each part's raw sha256</text><circle cx="332" cy="449" r="3" class="blue"/><text x="342" y="453" class="ink" font-size="12.5">each part's raw rows</text></g>
<g class="rise d5"><rect x="660" y="282" width="300" height="127" rx="10" class="panel" stroke-width="1.2"/><text x="676" y="306" class="blue b" font-size="13">after reconcile · 9 checks</text><text x="676" y="324" class="faint" font-size="11.5">the six again, plus the shard summary:</text><circle cx="682" cy="344" r="3" class="blue"/><text x="692" y="348" class="ink" font-size="12.5">exactly the listed parts</text><circle cx="682" cy="365" r="3" class="blue"/><text x="692" y="369" class="ink" font-size="12.5">each part in a listed status</text><circle cx="682" cy="386" r="3" class="blue"/><text x="692" y="390" class="ink" font-size="12.5">each part of its listed pack</text></g>
<g class="rise d6"><circle cx="1060" cy="222" r="22" class="red pulse"/><circle cx="1060" cy="222" r="22" class="red-c" stroke-width="1.6"/><path d="M1052 214l16 16M1068 214l-16 16" class="red-s" stroke-width="2.4" stroke-linecap="round"/><text x="1060" y="268" class="red b" font-size="13" text-anchor="middle">a difference</text><text x="1060" y="286" class="red b" font-size="13" text-anchor="middle">stops the run</text><text x="1060" y="308" class="faint" font-size="11.5" text-anchor="middle">every difference in</text><text x="1060" y="324" class="mono faint" font-size="11.5" text-anchor="middle">inventory_check.json</text></g>
<path d="M894 222H1030" class="red-s" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="40" y="514" class="mono mute" font-size="12">After a job: inventory_check.py --inventory … --cleaned … --ledger … --shards … runs the same 9 checks on the returned folders.</text>
<text x="40" y="536" class="faint" font-size="12">On the rehearsal's 3 parts: 9 of 9 pass; a part removed, added or with another status fails, naming the part.</text>
</svg>
