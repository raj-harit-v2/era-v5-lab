<g class="rise d7"><rect x="800" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="800" y="150" width="4" height="132" rx="2" class="amber"/><text x="818" y="176" class="mono amber" font-size="12">05</text><text x="818" y="202" class="ink b" font-size="18">shards</text><text x="818" y="226" class="mono mute" font-size="11.5">run_shards.py →</text><text x="818" y="244" class="mono mute" font-size="11.5">shard_writer.py · p1536</text><text x="818" y="268" class="amber" font-size="12">stages.shards · #39</text></g>
