<g class="fade d7"><text x="312.0" y="352" class="mono ink" font-size="12.5" text-anchor="middle">overlap/</text><text x="312.0" y="370" class="mono faint" font-size="11" text-anchor="middle">matches · docs</text></g>
<g class="rise d5"><rect x="416" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="416" y="150" width="4" height="132" rx="2" class="teal"/><text x="434" y="176" class="mono teal" font-size="12">03</text><text x="434" y="202" class="ink b" font-size="18">dedup</text><text x="434" y="226" class="mono mute" font-size="11.5">dedup/dedup.py</text><text x="434" y="244" class="mono mute" font-size="11.5">rules 0–4 · remove list</text><text x="434" y="268" class="teal" font-size="12">TSAI job · #255</text></g>
