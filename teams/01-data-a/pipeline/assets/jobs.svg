<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">The job chain</title>
<desc id="d">Six jobs in order: clean, overlap and dedup (TSAI job requests, adopted or run by the runner), then the pipeline (apply, F2, survivor loss, ledger), shards (run_shards.py and shard_writer.py with the p1536 tokenizer) and reconcile. Each reads the folder the one before wrote; the production job runs all six in one run.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em}
.h1{font-size:24px;font-weight:600}
.sub{font-size:14.5px}
.b{font-weight:600}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.1)}}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.bg{fill:#ffffff;stroke:#d1d9e0}.panel{fill:#f6f8fa;stroke:#d1d9e0}.edge{stroke:#d1d9e0}.edgef{fill:#d1d9e0}.bgf{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.faint{fill:#818b98}.inks{stroke:#1f2328}.mutes{stroke:#59636e}.teal{fill:#0f7b6c}.teal-s{stroke:#0f7b6c}.teal-t{fill:#e1f5f0}.teal-c{fill:#e1f5f0;stroke:#0f7b6c}.violet{fill:#8250df}.violet-s{stroke:#8250df}.violet-t{fill:#f1ebfd}.violet-c{fill:#f1ebfd;stroke:#8250df}.amber{fill:#9a6700}.amber-s{stroke:#9a6700}.amber-t{fill:#fdf3dc}.amber-c{fill:#fdf3dc;stroke:#9a6700}.red{fill:#cf222e}.red-s{stroke:#cf222e}.red-t{fill:#ffebe9}.red-c{fill:#ffebe9;stroke:#cf222e}.green{fill:#1a7f37}.green-s{stroke:#1a7f37}.green-t{fill:#dcf7e3}.green-c{fill:#dcf7e3;stroke:#1a7f37}.blue{fill:#0969da}.blue-s{stroke:#0969da}.blue-t{fill:#ddf0ff}.blue-c{fill:#ddf0ff;stroke:#0969da}.gray{fill:#6e7781}.gray-s{stroke:#6e7781}.gray-t{fill:#eef1f4}.gray-c{fill:#eef1f4;stroke:#6e7781}@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.edge{stroke:#30363d}.edgef{fill:#30363d}.bgf{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.faint{fill:#6e7681}.inks{stroke:#e6edf3}.mutes{stroke:#9198a1}.teal{fill:#3cc2a8}.teal-s{stroke:#3cc2a8}.teal-t{fill:#0d2a26}.teal-c{fill:#0d2a26;stroke:#3cc2a8}.violet{fill:#b392f0}.violet-s{stroke:#b392f0}.violet-t{fill:#221a38}.violet-c{fill:#221a38;stroke:#b392f0}.amber{fill:#d9a53a}.amber-s{stroke:#d9a53a}.amber-t{fill:#2b2111}.amber-c{fill:#2b2111;stroke:#d9a53a}.red{fill:#ff7b72}.red-s{stroke:#ff7b72}.red-t{fill:#3a1619}.red-c{fill:#3a1619;stroke:#ff7b72}.green{fill:#3fb950}.green-s{stroke:#3fb950}.green-t{fill:#10281a}.green-c{fill:#10281a;stroke:#3fb950}.blue{fill:#58a6ff}.blue-s{stroke:#58a6ff}.blue-t{fill:#0c2440}.blue-c{fill:#0c2440;stroke:#58a6ff}.gray{fill:#8b949e}.gray-s{stroke:#8b949e}.gray-t{fill:#1c2128}.gray-c{fill:#1c2128;stroke:#8b949e}}.tok{animation:tok 7s cubic-bezier(.45,0,.55,1) infinite}@keyframes tok{0%{transform:translateX(0);opacity:0}5%{opacity:1}8%,14%{transform:translateX(0px)}26%,32%{transform:translateX(192px)}44%,50%{transform:translateX(384px)}62%,68%{transform:translateX(576px)}80%,86%{transform:translateX(768px)}98%,104%{transform:translateX(960px)}98%{opacity:1}100%{transform:translateX(960px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<rect class="bg" x=".5" y=".5" width="1199" height="469" rx="14"/>
<g class="rise"><text x="40" y="48" class="eyebrow mute">THE JOB CHAIN</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">Six jobs, each reading the folder the one before wrote</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">Hand-overs are pinned by counts and sha256. The production job runs all six in one run_pipeline.py run.</text></g>
<g class="fade d3"><path d="M32 138v-6H592v6" fill="none" class="teal-s" stroke-width="1.3"/><text x="32" y="124" class="teal eyebrow" font-size="11">TSAI JOB REQUESTS · ADOPTED, OR RUN BY THE RUNNER</text></g>
<g class="fade d3"><path d="M608 138v-6H1168v6" fill="none" class="violet-s" stroke-width="1.3"/><text x="608" y="124" class="violet eyebrow" font-size="11">RUN_PIPELINE.PY · ONE CONFIG FILE</text></g>
<path d="M120.0 322H1080.0" class="edge" stroke-width="2"/>
<g class="rise d3"><rect x="32" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="32" y="150" width="4" height="132" rx="2" class="teal"/><text x="50" y="176" class="mono teal" font-size="12">01</text><text x="50" y="202" class="ink b" font-size="18">clean</text><text x="50" y="226" class="mono mute" font-size="11.5">run_tokenizer_sample.py</text><text x="50" y="244" class="mono mute" font-size="11.5">spec v1.1: use_clean.py</text><text x="50" y="268" class="teal" font-size="12">TSAI job · #244 · v1.1 #52</text></g>
