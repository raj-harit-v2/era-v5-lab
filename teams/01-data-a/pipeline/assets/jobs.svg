<g class="fade d6"><text x="120.0" y="352" class="mono ink" font-size="12.5" text-anchor="middle">cleaned/</text><text x="120.0" y="370" class="mono faint" font-size="11" text-anchor="middle">train/ heldout/ reports/</text></g>
<g class="rise d4"><rect x="224" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="224" y="150" width="4" height="132" rx="2" class="teal"/><text x="242" y="176" class="mono teal" font-size="12">02</text><text x="242" y="202" class="ink b" font-size="18">overlap</text><text x="242" y="226" class="mono mute" font-size="11.5">dedup/overlap.py</text><text x="242" y="244" class="mono mute" font-size="11.5">H1 + H2 matches</text><text x="242" y="268" class="teal" font-size="12">TSAI job · #255</text></g>
