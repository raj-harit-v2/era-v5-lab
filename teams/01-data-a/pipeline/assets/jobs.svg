<g class="motion"><g class="tok"><circle cx="120.0" cy="322" r="3.6" class="blue"/></g></g>
<text x="40" y="446" class="faint" font-size="12.5">The runner adopts a folder a TSAI job returned only after checking it against the job before; in the production job, it runs every job itself, from the raw parts.</text>
</svg>
