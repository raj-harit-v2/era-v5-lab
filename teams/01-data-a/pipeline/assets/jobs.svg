<g class="rise d8"><rect x="992" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="992" y="150" width="4" height="132" rx="2" class="amber"/><text x="1010" y="176" class="mono amber" font-size="12">06</text><text x="1010" y="202" class="ink b" font-size="18">reconcile</text><text x="1010" y="226" class="mono mute" font-size="11.5">reconcile_shards.py</text><text x="1010" y="244" class="mono mute" font-size="11.5">ledger ↔ shards</text><text x="1010" y="268" class="amber" font-size="12">stages.reconcile</text></g>
<path d="M1080.0 282V316" class="edge" stroke-width="1.5"/><circle cx="1080.0" cy="322" r="6" class="bgf amber-s" stroke-width="2"/>
