<g class="rise d6"><rect x="608" y="150" width="176" height="132" rx="10" class="panel" stroke-width="1.2"/><rect x="608" y="150" width="4" height="132" rx="2" class="violet"/><text x="626" y="176" class="mono violet" font-size="12">04</text><text x="626" y="202" class="ink b" font-size="18">pipeline</text><text x="626" y="226" class="mono mute" font-size="11.5">apply → f2 → survivor</text><text x="626" y="244" class="mono mute" font-size="11.5">loss → ledger</text><text x="626" y="268" class="violet" font-size="12">run_pipeline.py</text></g>
