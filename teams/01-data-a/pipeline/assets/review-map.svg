<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-labelledby="t d">
<title id="t">Reviewer's guide: who reviews which stage</title>
<desc id="d">The review split of PR #46, reviewers by GitHub handle. smitasasindran: the clean, overlap and dedup run steps. kunal2016: dedup and apply_dedup. TEJASKUMAR-REDDY-J: the ledger. patilvijay23: F2 and survivor loss. patilvijay23 and TEJASKUMAR-REDDY-J: shards and reconcile, which are required for the production job. New since bd09924: a stage script given as a list (08f2594), the expected inventory (1909fb2), the p1536 tokenizer pin (66eead1) and the licence in the shard manifest (dc1a1f6).</desc>
