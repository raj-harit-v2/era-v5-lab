<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-labelledby="t d">
<title id="t">The ledger</title>
<desc id="d">One row per document with the cleaner's action, dedup's role, F2's action and exactly one final status. Four examples: kept; dropped by the cleaner; removed by dedup as a copy of g0; and the survivor g0 dropped by F2.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em}
.h1{font-size:24px;font-weight:600}
.sub{font-size:14.5px}
.b{font-weight:600}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.1)}}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}.d10{animation-delay:1.20s}.d11{animation-delay:1.32s}.d12{animation-delay:1.44s}.d13{animation-delay:1.56s}.d14{animation-delay:1.68s}.d15{animation-delay:1.80s}.d16{animation-delay:1.92s}.d17{animation-delay:2.04s}.d18{animation-delay:2.16s}.d19{animation-delay:2.28s}.d20{animation-delay:2.40s}.d21{animation-delay:2.52s}.d22{animation-delay:2.64s}.d23{animation-delay:2.76s}.d24{animation-delay:2.88s}.bg{fill:#ffffff;stroke:#d1d9e0}.panel{fill:#f6f8fa;stroke:#d1d9e0}.edge{stroke:#d1d9e0}.edgef{fill:#d1d9e0}.bgf{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.faint{fill:#818b98}.inks{stroke:#1f2328}.mutes{stroke:#59636e}.teal{fill:#0f7b6c}.teal-s{stroke:#0f7b6c}.teal-t{fill:#e1f5f0}.teal-c{fill:#e1f5f0;stroke:#0f7b6c}.violet{fill:#8250df}.violet-s{stroke:#8250df}.violet-t{fill:#f1ebfd}.violet-c{fill:#f1ebfd;stroke:#8250df}.amber{fill:#9a6700}.amber-s{stroke:#9a6700}.amber-t{fill:#fdf3dc}.amber-c{fill:#fdf3dc;stroke:#9a6700}.red{fill:#cf222e}.red-s{stroke:#cf222e}.red-t{fill:#ffebe9}.red-c{fill:#ffebe9;stroke:#cf222e}.green{fill:#1a7f37}.green-s{stroke:#1a7f37}.green-t{fill:#dcf7e3}.green-c{fill:#dcf7e3;stroke:#1a7f37}.blue{fill:#0969da}.blue-s{stroke:#0969da}.blue-t{fill:#ddf0ff}.blue-c{fill:#ddf0ff;stroke:#0969da}.gray{fill:#6e7781}.gray-s{stroke:#6e7781}.gray-t{fill:#eef1f4}.gray-c{fill:#eef1f4;stroke:#6e7781}@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.edge{stroke:#30363d}.edgef{fill:#30363d}.bgf{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.faint{fill:#6e7681}.inks{stroke:#e6edf3}.mutes{stroke:#9198a1}.teal{fill:#3cc2a8}.teal-s{stroke:#3cc2a8}.teal-t{fill:#0d2a26}.teal-c{fill:#0d2a26;stroke:#3cc2a8}.violet{fill:#b392f0}.violet-s{stroke:#b392f0}.violet-t{fill:#221a38}.violet-c{fill:#221a38;stroke:#b392f0}.amber{fill:#d9a53a}.amber-s{stroke:#d9a53a}.amber-t{fill:#2b2111}.amber-c{fill:#2b2111;stroke:#d9a53a}.red{fill:#ff7b72}.red-s{stroke:#ff7b72}.red-t{fill:#3a1619}.red-c{fill:#3a1619;stroke:#ff7b72}.green{fill:#3fb950}.green-s{stroke:#3fb950}.green-t{fill:#10281a}.green-c{fill:#10281a;stroke:#3fb950}.blue{fill:#58a6ff}.blue-s{stroke:#58a6ff}.blue-t{fill:#0c2440}.blue-c{fill:#0c2440;stroke:#58a6ff}.gray{fill:#8b949e}.gray-s{stroke:#8b949e}.gray-t{fill:#1c2128}.gray-c{fill:#1c2128;stroke:#8b949e}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<rect class="bg" x=".5" y=".5" width="1199" height="491" rx="14"/>
<g class="rise"><text x="40" y="48" class="eyebrow mute">THE LEDGER</text></g><g class="rise d1"><text x="40" y="82" class="h1 ink">Every document, every decision, one row</text></g><g class="rise d2"><text x="40" y="108" class="sub mute">Built from what each stage wrote: it decides nothing, it lines the decisions up and checks that they agree.</text></g>
<text x="40" y="140" class="eyebrow mute" font-size="11">DOCUMENT</text><text x="330" y="140" class="eyebrow mute" font-size="11">CLEAN</text><text x="450" y="140" class="eyebrow mute" font-size="11">DEDUP</text><text x="720" y="140" class="eyebrow mute" font-size="11">F2</text><text x="900" y="140" class="eyebrow mute" font-size="11">FINAL</text>
<path d="M40 152H1160" class="edge" stroke-width="1.2"/>
<g class="rise d3"><text x="40" y="190" class="mono ink b" font-size="14">g1</text><text x="40" y="210" class="mono faint" font-size="11.5">code-go/part-00000 · row 1</text><rect x="330" y="174" width="64" height="24" rx="12" class="green-c" stroke-width="1"/><text x="362" y="191" class="green b" font-size="12" text-anchor="middle">keep</text><text x="450" y="190" class="ink" font-size="13">none</text><text x="720" y="190" class="green" font-size="13">kept</text><rect x="900" y="174" width="54" height="24" rx="12" class="green-c" stroke-width="1"/><text x="912" y="191" class="mono green b" font-size="12">kept</text><text x="900" y="212" class="mono faint" font-size="11.5">final row 0</text><path d="M40 222H1160" class="edge" stroke-dasharray="2 4"/></g>
<g class="rise d4"><text x="40" y="252" class="mono ink b" font-size="14">x-g0</text><text x="40" y="272" class="mono faint" font-size="11.5">raw row 1 · not in cleaned</text><rect x="330" y="236" width="64" height="24" rx="12" class="gray-c" stroke-width="1"/><text x="362" y="253" class="gray b" font-size="12" text-anchor="middle">drop</text><text x="450" y="252" class="ink" font-size="13">—</text><text x="720" y="252" class="faint" font-size="13">—</text><rect x="900" y="236" width="146" height="24" rx="12" class="gray-c" stroke-width="1"/><text x="912" y="253" class="mono gray b" font-size="12">dropped_by_clean</text><path d="M40 284H1160" class="edge" stroke-dasharray="2 4"/></g>
<g class="rise d5"><text x="40" y="314" class="mono ink b" font-size="14">g0</text><text x="40" y="334" class="mono faint" font-size="11.5">code-go/part-00001 · row 0</text><rect x="330" y="298" width="64" height="24" rx="12" class="green-c" stroke-width="1"/><text x="362" y="315" class="green b" font-size="12" text-anchor="middle">keep</text><text x="450" y="314" class="ink" font-size="13">removed G000001</text><text x="450" y="334" class="mono faint" font-size="11.5">H1 · 1.00 · kept g0</text><text x="720" y="314" class="faint" font-size="13">—</text><rect x="900" y="298" width="146" height="24" rx="12" class="red-c" stroke-width="1"/><text x="912" y="315" class="mono red b" font-size="12">removed_by_dedup</text><path d="M40 346H1160" class="edge" stroke-dasharray="2 4"/></g>
<g class="rise d6"><text x="40" y="376" class="mono ink b" font-size="14">g0</text><text x="40" y="396" class="mono faint" font-size="11.5">code-go/part-00000 · row 0</text><rect x="330" y="360" width="64" height="24" rx="12" class="teal-c" stroke-width="1"/><text x="362" y="377" class="teal b" font-size="12" text-anchor="middle">fix</text><text x="450" y="376" class="ink" font-size="13">survivor G000001</text><text x="720" y="376" class="red" font-size="13">dropped</text><text x="720" y="396" class="mono faint" font-size="11.5">item ids · offset</text><rect x="900" y="360" width="123" height="24" rx="12" class="red-c" stroke-width="1"/><text x="912" y="377" class="mono red b" font-size="12">dropped_by_f2</text><text x="900" y="398" class="mono faint" font-size="11.5">group lost</text><path d="M40 408H1160" class="edge" stroke-dasharray="2 4"/></g>
<text x="40" y="446" class="mono mute" font-size="12">ledger/&lt;split&gt;/&lt;pack&gt;.parquet · one row per document · exactly one final status · totals = the manifest's, per pack and split</text>
<text x="40" y="468" class="faint" font-size="12">IDs, codes and counts only, never text. The two g0 rows are the same doc_id in two parts: split + part + row is the key, not doc_id.</text>
</svg>
